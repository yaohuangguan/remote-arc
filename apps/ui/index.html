<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="application-name" content="Remote Arc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Remote Arc" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/remote-arc-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/remote-arc-192.png" />
    <script>
      try {
        const saved = localStorage.getItem("remote-arc-theme");
        const resolved = saved === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : (saved === "light" || saved === "dark" ? saved : "dark");
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/remote-arc.svg" />
    <link rel="canonical" href="https://remotearc.app/" />
    <meta property="og:site_name" content="Remote Arc" />
    <meta property="og:title" content="Remote Arc" />
    <meta property="og:description" content="Your computer. Your rules. Your AI." />
    <meta property="og:url" content="https://remotearc.app/" />
    <meta property="og:image" content="https://remotearc.app/remote-arc.svg" />
    <meta name="description" content="Remote Arc — Your computer. Your rules. Your AI." />
    <title>Remote Arc</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
