    <path d="M398 336C367 254 323 223 256 223C190 223 143 266 112 336" fill="none" stroke="url(#arc)" stroke-width="42" stroke-linecap="round" opacity=".78"/>
    <circle cx="112" cy="336" r="28" fill="#7DD3FC"/>
    <circle cx="398" cy="336" r="28" fill="#38BDF8"/>
    <circle cx="256" cy="223" r="20" fill="#F0F9FF"/>
  </g>
