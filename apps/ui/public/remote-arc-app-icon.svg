<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Remote Arc app icon">
  <defs>
    <radialGradient id="bg" cx="35%" cy="22%" r="92%">
      <stop offset="0" stop-color="#0d2334"/>
      <stop offset="0.55" stop-color="#07111e"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="arc" x1="120" y1="360" x2="400" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#38BDF8"/>
