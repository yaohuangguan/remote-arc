name: Publish remotelink

on:
  workflow_dispatch:
  push:
    tags:
      - "remotelink-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm --filter remotelink typecheck

      - name: Build CLI
        run: pnpm build:cli

      - name: Verify publish artifact
        run: |
          test -f packages/cli/dist/index.js
          grep -q '0.3.12' packages/cli/dist/index.js
          grep -q 'https://mcp.remotearc.app' packages/cli/dist/index.js
          ! grep -qi 'desktop.commander\|wonderwhy' packages/cli/dist/index.js

      - name: Publish
        working-directory: packages/cli
        run: npm publish --access public --provenance
