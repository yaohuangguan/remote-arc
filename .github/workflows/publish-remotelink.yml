name: Publish remotelink

on:
  workflow_dispatch:
  push:
    tags:
      - "remotelink-v*"
    branches:
      - "release/remotelink-v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: remotelink-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/device/go.mod
          cache-dependency-path: apps/device/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync release docs from CHANGELOG
        run: pnpm release:sync

      - name: Verify release ref
        if: github.event_name != 'workflow_dispatch'
        run: |
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [[ "$GITHUB_REF" == refs/heads/release/remotelink-v* ]]; then
            REF_VERSION="${GITHUB_REF_NAME#release/remotelink-v}"
          else
            REF_VERSION="${GITHUB_REF_NAME#remotelink-v}"
          fi
          test "$CLI_VERSION" = "$REF_VERSION" || {
            echo "Release ref version $REF_VERSION does not match package version $CLI_VERSION"
            exit 1
          }

      - name: Verify
        run: pnpm --filter remotelink typecheck

      - name: Build CLI and native Go distribution
        run: pnpm build:device --release

      - name: Verify native distribution and Homebrew formula
        run: node scripts/verify-device-artifacts.mjs

      - name: Publish and verify native Go release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          GO_TAG="go-agent-v$CLI_VERSION"
          node scripts/sync-release-docs.mjs --notes "$CLI_VERSION" > /tmp/go-release-notes.md
          if ! gh release view "$GO_TAG" >/dev/null 2>&1; then
            gh release create "$GO_TAG" \
              work/go-device/remotelink-go-v"$CLI_VERSION"-* \
              work/go-device/SHA256SUMS work/go-device/go-binaries.json work/go-device/remotelink-go.rb \
              --target "$GITHUB_SHA" --title "Remote Arc Go agent $CLI_VERSION" \
              --notes-file /tmp/go-release-notes.md --latest=false
          fi
          VERIFY_DIR="$(mktemp -d)"
          gh release download "$GO_TAG" --dir "$VERIFY_DIR" \
            --pattern "remotelink-go-v$CLI_VERSION-*" \
            --pattern SHA256SUMS --pattern go-binaries.json --pattern remotelink-go.rb
          cmp work/go-device/go-binaries.json "$VERIFY_DIR/go-binaries.json"
          cmp work/go-device/SHA256SUMS "$VERIFY_DIR/SHA256SUMS"
          cmp Formula/remotelink-go.rb "$VERIFY_DIR/remotelink-go.rb"
          (cd "$VERIFY_DIR" && sha256sum --check SHA256SUMS)

      - name: Verify publish artifact
        run: |
          test -f packages/cli/dist/index.js
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          grep -q "$CLI_VERSION" packages/cli/dist/index.js
          grep -q 'https://mcp.remotearc.app' packages/cli/dist/index.js
          ! grep -qi 'desktop.commander\|wonderwhy' packages/cli/dist/index.js

      - name: Smoke-test packed CLI
        run: |
          set -euo pipefail
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          PACK_JSON="$(cd packages/cli && npm pack --json --ignore-scripts)"
          TARBALL="$(PACK_JSON="$PACK_JSON" node -e 'const p=JSON.parse(process.env.PACK_JSON); process.stdout.write(p[0].filename)')"
          TMP_DIR="$(mktemp -d)"
          cd "$TMP_DIR"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/packages/cli/$TARBALL" --ignore-scripts >/dev/null
          ACTUAL="$(./node_modules/.bin/remotelink --version)"
          test "$ACTUAL" = "$CLI_VERSION" || {
            echo "Packed CLI reported $ACTUAL, expected $CLI_VERSION"
            exit 1
          }
          # This must download and execute the public, checksum-pinned Go asset.
          GO_ACTUAL="$(REMOTEARC_HOME="$TMP_DIR/go-home" ./node_modules/.bin/remotelink --go --version)"
          test "$GO_ACTUAL" = "$CLI_VERSION" || {
            echo "Packed Go CLI reported $GO_ACTUAL, expected $CLI_VERSION"
            exit 1
          }

          # Background mode copies the built entry file to ~/.remotearc/agent
          # without its package directory. Verify that copied artifact is truly
          # self-contained and can start from an isolated directory.
          cp "$GITHUB_WORKSPACE/packages/cli/dist/index.js" "$TMP_DIR/remotelink.mjs"
          STANDALONE="$(node "$TMP_DIR/remotelink.mjs" --version)"
          test "$STANDALONE" = "$CLI_VERSION" || {
            echo "Standalone background bundle reported $STANDALONE, expected $CLI_VERSION"
            exit 1
          }

      - name: Check whether version is already published
        id: npm_version
        run: |
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "remotelink@$CLI_VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "remotelink@$CLI_VERSION already exists; skipping npm publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.npm_version.outputs.publish == 'true'
        working-directory: packages/cli
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/remotelink-v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi
          CLI_VERSION="${TAG_NAME#remotelink-v}"
          node scripts/sync-release-docs.mjs --notes "$CLI_VERSION" > /tmp/release-notes.md
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "remotelink $CLI_VERSION" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "remotelink $CLI_VERSION" \
              --notes-file /tmp/release-notes.md
          fi

  public-install:
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify public npm and native Go installation
        run: node scripts/public-device-smoke.mjs
      - name: Verify Homebrew installation without Node
        if: runner.os == 'macOS'
        run: |
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          brew tap yaohuangguan/remote-arc https://github.com/yaohuangguan/remote-arc
          brew install yaohuangguan/remote-arc/remotelink-go
          test "$(remotelink --version)" = "$CLI_VERSION"
          brew test yaohuangguan/remote-arc/remotelink-go
