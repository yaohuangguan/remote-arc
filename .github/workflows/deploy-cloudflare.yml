name: Deploy Cloudflare

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-arc-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare production account access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6b1d0dd4e6f7f30df92753cd1e2ee12d
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")"
          RESPONSE="$RESPONSE" node -e '
            const payload = JSON.parse(process.env.RESPONSE || "{}");
            if (payload.success !== true || payload.result?.id !== process.env.CLOUDFLARE_ACCOUNT_ID) {
              console.error("Cloudflare token cannot access the Remote Arc production account.");
              process.exit(1);
            }
            console.log("Verified Remote Arc production Cloudflare account:", payload.result.id);
          '

      - name: Apply production D1 migrations
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          OUTPUT="$(pnpm exec wrangler d1 migrations apply remote-link-auth --remote 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            printf '%s\n' "$OUTPUT"
          elif printf '%s\n' "$OUTPUT" | grep -q 'code: 7403'; then
            printf '%s\n' "$OUTPUT"
            echo "::warning::Cloudflare deploy token cannot administer D1 migrations (7403). Continuing with the schema-compatible worker; apply pending migrations separately with D1-authorized credentials."
          else
            printf '%s\n' "$OUTPUT"
            exit "$STATUS"
          fi

      - name: Deploy Remote Arc to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REMOTEARC_PRODUCTION_DEPLOY: github-actions
          REMOTEARC_DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          REMOTEARC_DEPLOY_REF: master
        run: pnpm deploy:relay
