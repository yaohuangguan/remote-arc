version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      mcp-runtime:
        patterns:
          - "@modelcontextprotocol/*"
          - "zod"
          - "ws"
      tooling:
        patterns:
          - "@types/*"
          - "tsx"
          - "tsup"
          - "typescript"
          - "vite"
          - "@vitejs/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
